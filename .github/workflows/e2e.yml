name: E2E – verifikacija sajta

on:
  schedule:
    # Jednom dnevno u 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke testovi
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: https://www.savapex.com
